<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QuizGPT - Register</title>
    <link rel="stylesheet" href="../styles/styles.css"/>
</head>
<body class="auth-page">
    <main class="auth-shell">
        <div class="auth-brand">
            <img class="auth-brand-logo" src="../icons/icon48.png" alt="" width="48" height="48"/>
            <h1 class="auth-brand-title">QuizGPT</h1>
        </div>

        <div class="auth-body">
            <div id="registerForm" class="auth-card">
                <h2 class="auth-card-title">Create account</h2>
                <p class="auth-card-lede">Verify with a one-time email code.</p>

                <label class="auth-field">
                    <span class="auth-label">Email</span>
                    <input type="email" id="registerEmail" class="auth-input" placeholder="you@example.com" autocomplete="email" required/>
                </label>

                <label class="auth-field">
                    <span class="auth-label">Username</span>
                    <input type="text" id="registerUsername" class="auth-input" placeholder="Choose a username" autocomplete="username" required/>
                </label>

                <button type="button" id="registerButton" class="auth-btn auth-btn--primary">Register</button>
                <div id="registerError" class="auth-error hidden" role="alert"></div>

                <p class="auth-switch">
                    Already have an account?
                    <a href="login.html">Sign in</a>
                </p>
            </div>

            <div id="registerCodeForm" class="auth-card hidden">
                <div class="auth-card-top">
                    <button type="button" id="backToRegisterButton" class="auth-back" title="Back" aria-label="Back to register">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="m15 18-6-6 6-6"/>
                        </svg>
                    </button>
                    <h2 class="auth-card-title">Enter code</h2>
                </div>
                <p class="auth-card-lede">Check your email for a 6-digit code.</p>

                <label class="auth-field">
                    <span class="auth-label visually-hidden">Code</span>
                    <input type="text" id="registerCodeInput" class="auth-input auth-input--code" placeholder="••••••" maxlength="6" pattern="[0-9]*" inputmode="numeric" autocomplete="one-time-code" aria-label="6-digit code" required/>
                </label>

                <div class="auth-actions">
                    <button type="button" id="verifyRegisterCodeButton" class="auth-btn auth-btn--primary">Verify</button>
                    <button type="button" id="resendRegisterCodeButton" class="auth-btn auth-btn--ghost">Resend</button>
                </div>
                <div id="registerCodeError" class="auth-error hidden" role="alert"></div>
            </div>
        </div>
    </main>

    <script type="module" src="../scripts/register.js"></script>
</body>
</html>
